services:
  - type: web
    name: creatoros
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: QWEN_API_KEY
        sync: false
      - key: JIMENG_ACCESS_KEY_ID
        sync: false
      - key: JIMENG_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
